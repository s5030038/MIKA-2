<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIKA² - Discover Events</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <!-- logo & search bar -->
    <div class="header-start"> 
        <a href="index.html" class="logo" aria-label="Home">
            <img src="../images/logo.png" alt="Site logo" />
        </a>
        <!-- search bar -->
        <form class="search" action="#" method="get">
            <span class="search__icon" aria-hidden="true">⌕</span>
            <input id="search-input" type="search" name="q" placeholder="Search for Events..." autocomplete="off" />
        </form>
    </div>
<!-- right side of header (nav links, saved, profile) -->
    <div class="header-end">
        <nav class="nav" aria-label="Primary">
            <a href="index.html" class="nav__link">Home</a>
            <a href="browsingPage.html" class="nav__link is-active">Events</a>
            <a href="index.html" class="nav__link">About Us</a>
        </nav>

        <div class="header-actions">
            <a href="profilePage.html" class="icon-btn" aria-label="Profile">
                <span aria-hidden="true">♡</span>
            </a>
            <a href="profilePage.html" class="icon-btn" aria-label="Profile">
                <svg class="profile-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                    <circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="2" />
                    <path d="M5.5 19.5c1.6-3 4-4.5 6.5-4.5s4.9 1.5 6.5 4.5" />
                </svg>
            </a>
        </div>
    </div>
  </header>  

  <main>
    <section class="bphero">
        <div class="bphero__text">
            <h1>Discover Events</h1>
        </div>
        <div class="bphero__art">
            <img src="../images/recordplayerart.png" alt="Record Player" width="180" height="120"/>
        </div>
    </section>

    <div class="page-body">
        <!-- filter & sort section -->
        <aside class="filters" id="filters">
            <button type="button" class="filter-toggle" id="filter-toggle" aria-expanded="true" aria-controls="filters">
                × Filter &amp; Sort
            </button>
            <button type="button" class="filter-clear" id="filter-clear">
                Clear filter &amp; sort 
            </button>

            <div class="filter-group">
                <h2 class="filter-group__title">SORT</h2>
                <div class="filter-options" aria-label="Sort events">
                    <label class="filter-option">
                        <input type="radio" name="sort" value="soonest" checked />
                        <span class="filter-option__control" aria-hidden="true"></span>
                        <span>Date (Soonest)</span>
                    </label>
                    <label class="filter-option">
                        <input type="radio" name="sort" value="latest" />
                        <span class="filter-option__control" aria-hidden="true"></span>
                        <span>Date (Latest)</span>
                    </label>
                    <label class="filter-option">
                        <input type="radio" name="sort" value="price-low" />
                        <span class="filter-option__control" aria-hidden="true"></span>
                        <span>Price (Lowest)</span>
                    </label>
                    <label class="filter-option">
                        <input type="radio" name="sort" value="price-high" />
                        <span class="filter-option__control" aria-hidden="true"></span>
                        <span>Price (Highest)</span>
                    </label>
                </div>
            </div>

            <div class="filter-group">
                <h2 class="filter-group__title">PRICE</h2>
                <div class="filter-options">
                    <label class="filter-option">
                        <input type="checkbox" id="free-only" />
                        <span class="filter-option__control filter-option__control--check" aria-hidden="true"></span>
                        <span>Free events only</span>
                    </label>
                </div>
            </div>

            <div class="filter-group">
                <h2 class="filter-group__title">CATEGORY</h2>
                <div class="filter-options" id="category-filters">
                    <label class="filter-option">
                        <input type="checkbox" name="category" value="Music" />
                        <span class="filter-option__control filter-option__control--check" aria-hidden="true"></span>
                        <span>Music</span>
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" name="category" value="Festivals" />
                        <span class="filter-option__control filter-option__control--check" aria-hidden="true"></span>
                        <span>Festivals</span>
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" name="category" value="Creative" />
                        <span class="filter-option__control filter-option__control--check" aria-hidden="true"></span>
                        <span>Creative</span>
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" name="category" value="Tours" />
                        <span class="filter-option__control filter-option__control--check" aria-hidden="true"></span>
                        <span>Tours</span>
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" name="category" value="Exhibitions" />
                        <span class="filter-option__control filter-option__control--check" aria-hidden="true"></span>
                        <span>Exhibitions</span>
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" name="category" value="Workshops" />
                        <span class="filter-option__control filter-option__control--check" aria-hidden="true"></span>
                        <span>Workshops</span>
                    </label>
                </div>
            </div>
            
            <div class="filter-group">
                <h2 class="filter-group__title">AGE RANGE</h2>
                <div class="filter-options">
                    <label class="filter-option">
                        <input type="checkbox" name="age" value="Infants and toddlers" />
                        <span class="filter-option__control filter-option__control--check" aria-hidden="true"></span>
                        <span>Infants &amp; toddlers</span>
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" name="age" value="Preschool kids" />
                        <span class="filter-option__control filter-option__control--check" aria-hidden="true"></span>
                        <span>Preschool kids</span>
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" name="age" value="Kids" />
                        <span class="filter-option__control filter-option__control--check" aria-hidden="true"></span>
                        <span>Kids</span>
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" name="age" value="Teens" />
                        <span class="filter-option__control filter-option__control--check" aria-hidden="true"></span>
                        <span>Teenagers</span>
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" name="age" value="Young adults" />
                        <span class="filter-option__control filter-option__control--check" aria-hidden="true"></span>
                        <span>Young adults</span>
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" name="age" value="Adults (30+)" />
                        <span class="filter-option__control filter-option__control--check" aria-hidden="true"></span>
                        <span>Adults (30+)</span>
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" name="age" value="Seniors" />
                        <span class="filter-option__control filter-option__control--check" aria-hidden="true"></span>
                        <span>Seniors</span>
                    </label>
                </div>
            </div>
            
            <div class="filter-group">
                <h2 class="filter-group__title">BOOKINGS</h2>
                <div class="filter-options">
                    <label class="filter-option">
                        <input type="checkbox" name="bookings" value="required" />
                        <span class="filter-option__control filter-option__control--check" aria-hidden="true"></span>
                        <span>Booking required</span>
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" name="bookings" value="walkin" />
                        <span class="filter-option__control filter-option__control--check" aria-hidden="true"></span>
                        <span>Walk-in (no booking)</span>
                    </label>
                </div>
            </div>

            <div class="filter-group">
                <h2 class="filter-group__title">VENUE</h2>
                <div class="filter-options filter-options--scroll" id="venue-filters"></div> 
            </div>
        </aside>
        
        <!-- Event card section -->
        <div class="page-main">
            <button type="button" class="filter-open" id="filter-open">
                + Filter &amp; Sort
            </button>

            <section class="browseevents" id="browseevents" aria-label="Upcoming events">
                <!-- event card insert via api-events.js -->
            </section>
        </div>
    </div>
  </main>

    <footer class="site-footer" id="about">
        <div class="site-footer__intro">
            <a href="index.html" class="site-footer__brand" aria-label="MIKA squared home">
                <img src="../images/logo.png" alt="">
                <span>MIKA²</span>
            </a>
            <p>Find your next creative moment and form social connections in your local community.</p>
        </div>
        <nav class="site-footer__links" aria-label="Footer">
            <h2>Discover</h2>
            <a href="index.html">Home</a>
            <a href="browsingPage.html">Explore events</a>
            <a href="profilePage.html">Your profile</a>
        </nav>
        <div class="site-footer__bottom">
            <span>© 2026 MIKA²</span>
            <span>Connect, Collab, Create.</span>
        </div>
    </footer>

  <script src="../js/filters.js"></script>
  <script src="../js/api-creative.js"></script>
  <script src="../js/script.js"></script>
</body>
</html>
