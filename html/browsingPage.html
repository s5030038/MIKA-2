<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Events</title>
</head>
<body>
  <header class="site-header">
    <!-- logo & search bar -->
    <div class="header-start"> 
        <a href="index.html" class="logo" aria-label="Home">
            <img src="../images/logo.png" alt="Site logo" />
        </a>
        <!-- search bar -->
        <form class="search" action="#" method="get">
            <label class="sr-only" for="search-input">Search for events</label>
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="search-input" type="search" name="q" placeholder="Search for Events..." autocomplete="off" />
        </form>
    </div>

    <div class="header-end">
        <nav class="nav" aria-label="Primary">
            <a href="homePage.html" class="nav__link">Home</a>
            <a href="browsingPage.html" class="nav__link is-active">Events</a>
            <a href="homePage.html" class="nav_link">About Us</a>
        </nav>

        <div class="header-actions">
            <button type="button" class="icon-btn" aria-label="saved-events">
                <span aria-hidden="true">♡</span>
            </button>
            <button type="button" class="icon-btn" aria-label="Profile">
                <svg class="profile-icon" viewbox="0 0 24 24" width="22" height="22" aria-hidden="true">
                    <circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="2" />
                    <path d="M5.5 19.5c1.6-3 4-4.5 6.5-4.5s4.9 1.5 6.5 4.5" />
                </svg>
            </button>
        </div>
    </div>

  </header>  
</body>
</html>
