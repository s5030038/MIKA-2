<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bookings page</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- header -->
    <header class="site-header">
    <!-- logo & search bar -->
    <div class="header-start"> 
        <a href="index.html" class="logo" aria-label="Home">
            <img src="../images/logo.png" alt="Site logo" />
        </a>
        <!-- search bar -->
        <form class="search" action="#" method="get">
            <span class="search__icon" aria-hidden="true">⌕</span>
            <input id="search-input" type="search" name="q" placeholder="Search for Events..." autocomplete="off" />
        </form>
    </div>
<!-- right side of header (nav links, saved, profile) -->
    <div class="header-end">
        <nav class="nav" aria-label="Primary">
            <a href="index.html" class="nav__link">Home</a>
            <a href="browsingPage.html" class="nav__link">Events</a>
            <a href="index.html" class="nav__link">About Us</a>
        </nav>

        <div class="header-actions">
            <button type="button" class="icon-btn" aria-label="saved-events">
                <span aria-hidden="true">♡</span>
            </button>
            <a href="profilePage.html" class="icon-btn" aria-label="Profile">
                <svg class="profile-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                    <circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="2" />
                    <path d="M5.5 19.5c1.6-3 4-4.5 6.5-4.5s4.9 1.5 6.5 4.5" />
                </svg>
            </a>
            </button>
        </div>
    </div>
</header> 

<main class="event-details">
    <!-- banner-carousel section -->
     <section id="banner-carousel">
        <div id="carousel-container">
            <img src="../images/eventcard1.png" alt="main-cover">
            <button class="arrow-left"><img src="../images/left-arrow.png" alt="left-arrow"></button>
            <button class="arrow-right"><img src="../images/right-arrow.png" alt="right-arrow"></button>
        </div>

        <!-- event and host-->
        <div id="header-content">
            <div id="event-and-host">
                <h1>Tiny Desk Concert</h1>
                <div class="buttons">
                    <button></button>   ****
                    <button></button> ****
                </div>
            </div>

            <div id="host-info">
                <div id="host-avatar"><img>****</div>
                <div id="host-details">
                    <p class="host-name">Host: <strong>Australia Zoo</strong></p> <button>***</button>
                    <img>***<p class="location">1 Kingston Rd, Woodridge, Brisbane, QLD</p>
                    <img>***<p class="date">Sunday, November 21 | 12:30-3PM</p>
                </div>
            </div>
        </div>
     </section>

     <!-- sticky sub-navigation-->
     <nav class="sub-nav">
        <div class="container-nav-tabs">
            <a href="#overview" class="tab-link">Overview</a>
            <a href="#itinerary" class="tab-link">Itinerary</a>
            <a href="#reviews" class="tab-link">Reviews</a>
            <a href="#discussion" class="tab-link">Discussion Board</a>
        </div>
     </nav>


</main>

</body>

</html>
